name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['*.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate icons
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow
          python tools/make_icons.py .

      - name: Install dependencies
        run: npm install

      - name: Bundle native text-to-speech bridge
        run: npm run build:tts

      - name: APK build info
        run: echo '{"n":${{ github.run_number }},"repo":"${{ github.repository }}","tag":"qisas-latest"}' > www/apk-build.json
      - name: Shell mode (open the website) + native fingerprint
        run: |
          NH=$(cat capacitor.config.json package.json tools/android-patch.py tools/ApkInstallerPlugin.java tools/make_icons.py | sha256sum | cut -c1-8)
          echo "NH=$NH" >> "$GITHUB_ENV"
          node tools/set-url.js "https://zarzouramahmoudabdo-commits.github.io/qisas-al-anbiya-/?apk=${{ github.run_number }}&nh=$NH"
      - name: Create Android project
        run: npx cap add android

      - name: Android signing + installer plugin
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: python3 tools/android-patch.py
      - name: Sync native plugins
        run: npx cap sync android

      - name: Generate launcher icons
        run: npx --yes @capacitor/assets generate --android --iconBackgroundColor '#0b5d3b' --iconBackgroundColorDark '#073d27'

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Qisas-Al-Anbiya.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Qisas-Al-Anbiya-apk
          path: Qisas-Al-Anbiya.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # QISAS-SAFE-RELEASE: نرفع الملف الجديد أولًا، ثم نحدّث رقم الإصدار، ثم نحذف القديم
          N=${{ github.run_number }}
          cp Qisas-Al-Anbiya.apk "Qisas-Al-Anbiya-$N.apk"
          gh release view qisas-latest >/dev/null 2>&1 || gh release create qisas-latest --title "قصص الأنبياء — أحدث نسخة APK" --notes "build 0"
          gh release upload qisas-latest "Qisas-Al-Anbiya-$N.apk" --clobber
          gh release upload qisas-latest Qisas-Al-Anbiya.apk --clobber
          gh release edit qisas-latest --notes "build $N native $NH" --title "قصص الأنبياء — أحدث نسخة APK"
          for a in $(gh release view qisas-latest --json assets --jq '.assets[].name'); do
            case "$a" in "Qisas-Al-Anbiya-$N.apk"|"Qisas-Al-Anbiya.apk") ;; *) gh release delete-asset qisas-latest "$a" -y ;; esac
          done
